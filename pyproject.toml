[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qec-bench"
version = "0.1.0"
description = "QEC decoder benchmark: Stim + PyMatching + BP-OSD + sinter"
requires-python = ">=3.11"
dependencies = [
    "stim>=1.14",
    "pymatching>=2.2",
    "sinter>=1.14",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "ldpc>=2.4",
]

[project.scripts]
qec-bench = "qec_bench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/qec_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running Monte Carlo tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear,
# ANN type hints on every signature (CLAUDE.md rule).
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
# B905: several zips pair a list with its own tail (zip(ps, ps[1:])), so strict=True
# would change behaviour; strict=False everywhere would only add noise.
ignore = ["ANN401", "B905"]
